[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permitgraph-cli"
version = "0.1.0"
description = "Developer/operator CLI client for the PermitGraph API"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "permitgraph-rules-engine",
]

[project.scripts]
permitgraph = "permitgraph_cli.main:app"

[tool.setuptools]
packages = ["permitgraph_cli", "permitgraph_cli.commands"]
