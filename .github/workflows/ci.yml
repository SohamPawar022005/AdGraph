name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python packages + API (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install internal packages (editable)
        run: |
          pip install --upgrade pip
          for pkg in shared rules-engine graph-engine change-detection impact-analysis document-engine regulatory-parser workflow-engine; do
            pip install -e "packages/$pkg"
          done

      - name: Install apps/api dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install permitgraph CLI
        run: pip install -e cli

      - name: Lint (ruff: undefined names / unused imports / syntax errors)
        run: |
          pip install ruff
          ruff check packages apps/api cli scripts

      - name: Test internal packages
        run: python -m pytest packages/*/tests -q

      - name: Test API (46 cases against a real seeded SQLite DB)
        working-directory: apps/api
        run: python -m pytest -q

      - name: CLI smoke test (local, API-free command)
        run: permitgraph validate rules-dir data/candidate/rules

  web:
    name: Web frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: permitgraph-api:ci

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          tags: permitgraph-web:ci
