[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permitgraph-impact-analysis"
version = "0.1.0"
description = "Impact analysis engine: regulatory change -> affected approvals/businesses/applications"
requires-python = ">=3.10"
dependencies = [
    "permitgraph-graph-engine",
    "permitgraph-shared",
]

[tool.setuptools]
packages = ["impact_analysis"]
