[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permitgraph-rules-engine"
version = "0.1.0"
description = "Declarative rules-as-code engine for PermitGraph"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.4",
    "PyYAML>=6.0",
    "permitgraph-shared",
]

[tool.setuptools]
packages = ["rules_engine"]
