[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permitgraph-regulatory-parser"
version = "0.1.0"
description = "Section/clause structural parser for Indian state Act text (candidate extraction, not final fact)"
requires-python = ">=3.10"
dependencies = [
    "permitgraph-shared",
]

[tool.setuptools]
packages = ["regulatory_parser"]
