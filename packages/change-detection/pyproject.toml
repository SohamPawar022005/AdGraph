[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permitgraph-change-detection"
version = "0.1.0"
description = "Deterministic regulatory change detection (semantic diff) for PermitGraph"
requires-python = ">=3.10"
dependencies = [
    "permitgraph-shared",
]

[tool.setuptools]
packages = ["change_detection"]
