[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permitgraph-document-engine"
version = "0.1.0"
description = "Document ingestion, hashing, OCR and text-extraction pipeline for PermitGraph"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=3.17",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "Pillow>=10.0",
    "permitgraph-shared",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "reportlab>=4.0"]

[tool.setuptools]
packages = ["document_engine"]
