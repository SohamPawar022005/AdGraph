[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permitgraph-workflow-engine"
version = "0.1.0"
description = "Deterministic workflow + SLA state machine for PermitGraph applications"
requires-python = ">=3.10"
dependencies = [
    "permitgraph-shared",
]

[tool.setuptools]
packages = ["workflow_engine"]
