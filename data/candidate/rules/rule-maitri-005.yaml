id: RULE-MAITRI-005
name: Applications undecided within the time limit are escalated to the Empowered
  Committee
source:
  document: maitri-act-2023
  section: Section 5
  url: https://www.indiacode.nic.in/bitstream/123456789/20544/1/the_maharashtra_industry,_trade_and_investment_facilitation_act,_2023.pdf
effective:
  from: '2023-07-03'
applies_when:
  all:
  - field: jurisdiction
    operator: equals
    value: Maharashtra
  - field: sla_state
    operator: equals
    value: overdue
requires:
- approval: empowered-committee-escalation
actions:
- type: escalate
  metadata:
    message: According to Section 5 of the MAITRI Act 2023, if the Competent Authority
      fails to dispose of an application within the specified time limit, the Nodal
      Agency (MAITRI) transfers the application to the Empowered Committee, which
      then disposes of it under the relevant law.
confidence: 0.9
notes: Direct transcription of Section 5(1)-(3).
tags:
- maitri
- escalation
- empowered-committee
jurisdiction: Maharashtra
status: candidate
version: v1
