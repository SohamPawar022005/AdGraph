actions:
- type: inform
  metadata:
    message: According to Section 18 of the MAITRI Act 2023, the Supervisory Committee,
      Empowered Committee, Nodal Agency and Competent Authorities must exercise their
      powers, discharge their functions, and respond to entrepreneur/investor queries
      within time limits fixed by rules made under the Act. PermitGraph does not fabricate
      the specific day-counts because the implementing rules were not part of the
      supplied source corpus.
