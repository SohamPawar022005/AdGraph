actions:
- type: inform
  metadata:
    message: According to Section 46 of the Maharashtra Industrial Development Act,
      1961, any person who uses land or a building in an industrial estate or industrial
      area contrary to the terms under which they hold it, or in contravention of
      applicable regulations, is on conviction punishable with a fine which may extend
      to five thousand rupees.
