server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    location /ready {
        proxy_pass http://api:8000;
    }

    # Single-page app: let React Router handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
